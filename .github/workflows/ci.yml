name: Continuous Integration (CI)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # ==========================================
  # Job 1: Build & Test React Admin (TrackOps)
  # ==========================================
  build-admin:
    name: Build Trackify Admin
    runs-on: ubuntu-latest
    
    # We specify the working directory because the React app is in a subfolder
    defaults:
      run:
        working-directory: ./Trackify_Admin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for TruffleHog to scan commit history



      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './Trackify_Admin/package-lock.json'

      - name: Install Dependencies
        run: npm install

      - name: Build React App
        run: npm run build
        

