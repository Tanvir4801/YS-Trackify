version: '3.8'

services:
  trackify-admin:
    build:
      context: ./Trackify_Admin
      dockerfile: Dockerfile
    container_name: trackify-admin
    ports:
      - "8080:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
